name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure gradlew is executable
        run: chmod +x gradlew

      - name: Build jar
        run: ./gradlew jar --no-daemon

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: chunkbench-jar
          path: build/libs/chunkbench-*.jar
          if-no-files-found: error
          retention-days: 14
