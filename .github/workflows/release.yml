name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.0.1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            RAW="${{ inputs.version }}"
          else
            RAW="${GITHUB_REF_NAME}"
          fi
          RAW="${RAW#v}"
          echo "version=${RAW}" >> "$GITHUB_OUTPUT"
          echo "tag=v${RAW}" >> "$GITHUB_OUTPUT"
          echo "Resolved version=${RAW} tag=v${RAW}"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure gradlew is executable
        run: chmod +x gradlew

      - name: Build release jar
        run: ./gradlew jar --no-daemon -PrelVersion=${{ steps.ver.outputs.version }}

      - name: Prepare release assets
        shell: bash
        run: |
          mkdir -p dist
          JAR=$(ls build/libs/chunkbench-*.jar | head -n1)
          cp "$JAR" "dist/chunkbench-${{ steps.ver.outputs.version }}.jar"
          cp "$JAR" dist/chunkbench.jar
          ls -la dist/

      - name: Write release preamble
        shell: bash
        run: |
          cat > release-preamble.md <<'EOF'
          ## ChunkBench VERSION_PLACEHOLDER

          Capacity audit plugin for Minecraft servers (**1.8.8 – 26.2**) by **pozii**.

          ### Install
          1. Download `chunkbench.jar` (or the versioned jar below)
          2. Place it in your server `plugins/` folder
          3. Restart the server
          4. Run `/chunkbench` in-game (permission `chunkbench.run`, default OP)

          ### Assets
          - `chunkbench.jar` — drop-in plugin jar
          - `chunkbench-VERSION_PLACEHOLDER.jar` — versioned copy of the same build

          Licensed under **PolyForm Shield 1.0.0**.

          ---
          EOF
          sed -i 's/^          //' release-preamble.md
          sed -i "s/VERSION_PLACEHOLDER/${{ steps.ver.outputs.version }}/g" release-preamble.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ChunkBench ${{ steps.ver.outputs.version }}
          body_path: release-preamble.md
          generate_release_notes: true
          files: |
            dist/chunkbench.jar
            dist/chunkbench-${{ steps.ver.outputs.version }}.jar
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
