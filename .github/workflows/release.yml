name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.0.1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            RAW="${{ inputs.version }}"
          else
            RAW="${GITHUB_REF_NAME}"
          fi
          RAW="${RAW#v}"
          echo "version=${RAW}" >> "$GITHUB_OUTPUT"
          echo "tag=v${RAW}" >> "$GITHUB_OUTPUT"
          echo "jar=ChunkBench-${RAW}.jar" >> "$GITHUB_OUTPUT"
          echo "Resolved version=${RAW} tag=v${RAW}"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure gradlew is executable
        run: chmod +x gradlew

      - name: Build release jar
        run: ./gradlew jar --no-daemon -PrelVersion=${{ steps.ver.outputs.version }}

      - name: Prepare release asset
        shell: bash
        run: |
          mkdir -p dist
          JAR=$(ls build/libs/ChunkBench-*.jar | head -n1)
          cp "$JAR" "dist/${{ steps.ver.outputs.jar }}"
          ls -la dist/

      - name: Build release notes
        shell: bash
        run: |
          sed \
            -e "s/__VERSION__/${{ steps.ver.outputs.version }}/g" \
            -e "s/__JAR__/${{ steps.ver.outputs.jar }}/g" \
            .github/release-body-template.md > release-body.md
          cat release-body.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ChunkBench ${{ steps.ver.outputs.version }}
          body_path: release-body.md
          generate_release_notes: true
          files: dist/${{ steps.ver.outputs.jar }}
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
